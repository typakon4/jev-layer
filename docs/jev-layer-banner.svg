<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">jev-layer</title>
  <desc id="desc">Portable System-1 decision layer for agent harnesses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12233d"/>
      <stop offset="1" stop-color="#123f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3c4"/>
      <stop offset="1" stop-color="#8bd5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="-15" r="220" fill="#66e3c4" opacity="0.08"/>
  <circle cx="1120" cy="245" r="180" fill="#8bd5ff" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="72" y="64" width="132" height="132" rx="30" fill="#152e46" stroke="#66e3c4" stroke-width="2"/>
    <path d="M105 128h66M138 95v66" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="138" cy="128" r="18" fill="#0b1220" stroke="#8bd5ff" stroke-width="4"/>
  </g>
  <text x="248" y="128" fill="#f6fbff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="66" font-weight="750" letter-spacing="-2">jev-layer</text>
  <text x="252" y="166" fill="#b9cce0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">portable System-1 decisions for agent harnesses</text>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    <rect x="252" y="191" width="112" height="34" rx="17" fill="#173d43" stroke="#66e3c4"/>
    <text x="308" y="213" text-anchor="middle" fill="#9af0d9">ROUTE</text>
    <rect x="376" y="191" width="126" height="34" rx="17" fill="#173d43" stroke="#66e3c4"/>
    <text x="439" y="213" text-anchor="middle" fill="#9af0d9">RECEIPTS</text>
    <rect x="514" y="191" width="112" height="34" rx="17" fill="#173d43" stroke="#66e3c4"/>
    <text x="570" y="213" text-anchor="middle" fill="#9af0d9">REPLAY</text>
    <rect x="638" y="191" width="130" height="34" rx="17" fill="#173d43" stroke="#8bd5ff"/>
    <text x="703" y="213" text-anchor="middle" fill="#b9e4ff">FAIL-OPEN</text>
  </g>
</svg>
