<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">jev-layer architecture</title>
  <desc id="desc">Agent harnesses submit bounded requests to jev-layer. The host owns permissions and execution, while jev-layer returns a decision and records receipts for replay.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e9f3f8"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12314c"/>
      <stop offset="1" stop-color="#14525a"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefcf7"/>
      <stop offset="1" stop-color="#d8f3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#228e9b"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b6e9e0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183b52" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#surface)"/>
  <text x="640" y="56" text-anchor="middle" fill="#102c45" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">Host-owned execution, bounded decisions</text>
  <text x="640" y="86" text-anchor="middle" fill="#567086" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">jev-layer chooses and records; the host validates and acts</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="300" height="205" rx="22" fill="#ffffff" stroke="#9bb4c7" stroke-width="2"/>
    <rect x="70" y="145" width="300" height="52" rx="22" fill="#e6f0f6"/>
    <path d="M70 175h300" stroke="#e6f0f6" stroke-width="2"/>
    <text x="220" y="179" text-anchor="middle" fill="#173c57" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="750">Agent harnesses</text>
    <text x="104" y="232" fill="#294c63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Hermes · OMP · Codex</text>
    <text x="104" y="264" fill="#294c63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">generic MCP clients</text>
    <text x="104" y="309" fill="#637d90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">supplies intent, candidates, context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="120" width="300" height="255" rx="22" fill="url(#decision)" stroke="#66e3c4" stroke-width="3"/>
    <text x="640" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="750">jev-layer</text>
    <text x="640" y="195" text-anchor="middle" fill="#a9e8db" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">SYSTEM-1 DECISION LAYER</text>
    <path d="M535 222h210M535 273h210M535 324h210" stroke="#6ea7ac" stroke-opacity="0.55"/>
    <text x="640" y="247" text-anchor="middle" fill="#f2ffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">route · supervise</text>
    <text x="640" y="298" text-anchor="middle" fill="#f2ffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">context filter · fail-open</text>
    <text x="640" y="349" text-anchor="middle" fill="#b6e9e0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">returns one bounded decision + id</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="145" width="300" height="205" rx="22" fill="#ffffff" stroke="#9bb4c7" stroke-width="2"/>
    <rect x="910" y="145" width="300" height="52" rx="22" fill="#e6f0f6"/>
    <text x="1060" y="179" text-anchor="middle" fill="#173c57" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="750">Host policy boundary</text>
    <text x="944" y="232" fill="#294c63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">permissions · approvals</text>
    <text x="944" y="264" fill="#294c63" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">native execution · retries</text>
    <text x="944" y="309" fill="#637d90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">owns every side effect</text>
  </g>

  <path d="M370 220h110" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="425" y="204" text-anchor="middle" fill="#347485" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">bounded request</text>
  <path d="M490 315H370" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="430" y="342" text-anchor="middle" fill="#347485" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">decision + correlation_id</text>
  <path d="M790 220h120" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="850" y="204" text-anchor="middle" fill="#347485" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">selected capability</text>
  <path d="M910 315H790" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="850" y="342" text-anchor="middle" fill="#347485" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">execution receipt</text>

  <g filter="url(#shadow)">
    <rect x="260" y="470" width="760" height="150" rx="22" fill="url(#evidence)" stroke="#69b9aa" stroke-width="2"/>
    <text x="640" y="515" text-anchor="middle" fill="#14505a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="750">Evidence and replay</text>
    <text x="640" y="552" text-anchor="middle" fill="#286b73" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">jev_record_execution · receipts · JSONL cases</text>
    <text x="640" y="584" text-anchor="middle" fill="#4f7e82" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">correlation_id joins the decision to the host result; replay never executes host work</text>
  </g>
  <path d="M640 375v90" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1060 350v72q0 48-48 48h-22" fill="none" stroke="#228e9b" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
